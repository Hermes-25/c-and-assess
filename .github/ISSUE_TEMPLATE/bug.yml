name: Bug report
description: Report reproducible product behaviour that is not a security issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include candidate data, cookies, OAuth details or production exports.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page, expected behaviour and actual behaviour.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Product area
      options:
        - Candidate desk and registration
        - Exam interface and saving
        - Submission and results
        - Organizer workspace
        - CSV and images
        - Authentication
        - Deployment and operations
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction
      description: Use demo or synthetic data only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and environment
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, candidate data and private identifiers.
          required: true
