name: Deploy C&Assess Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: c-and-assess-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: npm

      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install exact dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Verify free-tier and optional storage configuration
        run: node scripts/verify_deployment_config.mjs

      - name: Render account-specific Wrangler configuration
        run: node scripts/render_wrangler_config.mjs
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ inputs.environment == 'production' && vars.CLOUDFLARE_CUSTOM_DOMAIN || '' }}

      - name: Apply forward-only D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the tested Worker
        run: npx wrangler deploy --config dist/server/wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write release summary
        shell: bash
        run: |
          echo "### C&Assess deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations: applied before code deployment" >> "$GITHUB_STEP_SUMMARY"
